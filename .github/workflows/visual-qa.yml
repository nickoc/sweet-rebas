name: Visual QA / mobile

# Triggers on Vercel deployment status events. Vercel posts a deployment_status
# with state=success once a preview is built, and we use that URL to capture
# the cross-device screenshot matrix defined in docs/device-test-matrix.md.
on:
  deployment_status:

  # Manual run: useful for re-running against an arbitrary URL or main branch.
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override URL (defaults to deployment_status URL)"
        required: false
        type: string

jobs:
  visual-qa:
    # Only run for successful preview deploys (not failed builds, not production unless we want to).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Resolve preview URL
        id: url
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.deployment_status.target_url || github.event.deployment_status.environment_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for preview to be reachable
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Probing $URL …"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 5 "$URL"; then
              echo "Reachable on attempt $i"
              exit 0
            fi
            echo "  attempt $i: not yet ready"
            sleep 5
          done
          echo "Preview never became reachable"
          exit 1

      - name: Run cross-device screenshot matrix
        env:
          QA_BASE_URL: ${{ steps.url.outputs.url }}
        run: bun run scripts/qa-screenshots.ts

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: test-results/qa
          retention-days: 14
          if-no-files-found: warn

      - name: Comment on PR with artifact link
        if: always() && github.event_name == 'deployment_status' && github.event.deployment.payload.pr_number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.deployment.payload.pr_number;
            const url = "${{ steps.url.outputs.url }}";
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              `🖼️ **Visual QA / mobile** for ${url}`,
              ``,
              `Cross-device screenshot matrix captured (9 viewports × 12 routes).`,
              ``,
              `[View artifacts](${runUrl}) — download \`visual-qa-screenshots.zip\` to inspect.`,
              ``,
              `Per [docs/device-test-matrix.md](https://github.com/${{ github.repository }}/blob/main/docs/device-test-matrix.md). P0 viewports: iPhone 17 Pro Max, iPhone 13, iPhone XR, iPhone SE.`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
